# 死链检查：只检查绝对 URL（http/https/mailto），
# 相对链接由 Git 仓库本身保证存在，不检查锚点片段。
exclude = [
  '^#',       # 页内锚点
  '^\./',     # 相对路径（仓库内文件）
  '^\.\./',   # 相对路径（仓库内文件）
  '^file://', # 文本中的邮件/地址被解析出的 file:// 产物，非真实链接
  '^mailto:', # 邮件地址
  # 同济校内站点：多数仅校园网可达、易被 WAF 拦截（403/401）或 SSL 异常，CI 无法稳定校验，
  # 且同一子域在不同网络环境下结果不稳定（本地与 CI 差异大）。
  '^https?://([^/]*\.)*tongji\.edu\.cn',
  '^https?://www\.cnki\.net',       # 中国知网：SSL 证书异常
  '^https?://scholar\.google\.com', # Google Scholar：反爬返回 403
  # 中国境内学习/招生平台：公网 CI 与本地网络均偶发超时/连接失败，链接为官方入口，不做死链校验
  '^https?://(www\.)?ilab-x\.com',                # iLAB-X 虚拟仿真实验平台
  '^https?://(www\.)?icourse163\.org',            # 中国大学 MOOC
  '^https?://i\.chaoxing\.com',                   # 学习通
  '^https?://www\.ketangpai\.com',                # 课堂派
  '^https?://www\.wanfangdata\.com\.cn',          # 万方数据
  '^https?://yz\.chsi\.com\.cn',                  # 学信网（研招）
  '^https?://(admissions\.sjtu\.edu\.cn|ao\.fudan\.edu\.cn)', # 交大/复旦本科招生办
]
# 不扫描 node_modules（npm 包自带文档与本站无关）
exclude_path = ["node_modules"]
# 限速防卡死：外部站点慢/证书坏时快速失败，不拖垮 CI
max_concurrency = 8
timeout = 20
max_retries = 1
# 隐私：不把请求发给统计端点
no_progress = true

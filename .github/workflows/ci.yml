name: wiki-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  markdown-quality:
    name: Markdown quality (markdownlint + textlint-zh + lychee)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: markdownlint (语法/风格)
        run: npm run lint:md

      - name: textlint-zh (中文排版规范)
        run: npm run lint:zh

      - name: lychee (死链检查)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress "**/*.md" ".agents/**/*.md"
